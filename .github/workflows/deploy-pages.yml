name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur die Seite ausliefern (ohne Werkzeug und Notizen)
        run: |
          mkdir _site
          cp -r index.html impressum.html datenschutz.html stil.css seite.js favicon.svg apple-touch-icon.png og.jpg schrift bilder _site/
          rm -f _site/bilder/mass.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
